<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Không tìm thấy trang | Nguyễn Thanh Văn</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1628">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Lora:wght@600&display=swap">
<style>
:root{--bg:#0a1628;--text:#f2ead6;--muted:#a9bbcf;--accent:#c9a84c;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem 1rem;background:var(--bg);color:var(--text);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.7}
main{width:min(100%,36rem)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.logo{display:inline-block;padding:.5rem 0;font-family:Lora,Georgia,serif;font-size:1.375rem;font-weight:600;color:var(--accent);text-decoration:none}
h1{margin:1.5rem 0 0;font-family:Lora,Georgia,serif;font-size:clamp(1.75rem,1.3rem + 2vw,2.5rem);font-weight:600;line-height:1.28}
p{margin:1rem 0 0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:3rem;padding:.7rem 1.35rem;border:1px solid var(--accent);border-radius:.5rem;font-weight:600;line-height:1.35;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-ghost{color:var(--accent)}
</style>
</head>
<body>
<main>
  <a class="logo" href="/">NTVăn</a>
  <h1>Không tìm thấy trang</h1>
  <p>Đường dẫn này không tồn tại hoặc đã được đổi. Bạn có thể quay về trang chủ hoặc nhắn Zalo cho tôi.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">Về trang chủ</a>
    <a class="btn btn-ghost" href="https://zalo.me/0968161343" target="_blank" rel="noopener">Nhắn Zalo</a>
  </div>
</main>
</body>
</html>
